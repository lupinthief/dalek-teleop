[project]
name = "dalek-teleop"
version = "0.1.0"
description = "WebRTC Voice and Teleoperation Service for the Dalek"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.9.0",
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    "miniaudio>=1.59",
    "cryptography>=42.0.0",
    "av>=11.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
dalek-teleop = "teleop.server:main"
